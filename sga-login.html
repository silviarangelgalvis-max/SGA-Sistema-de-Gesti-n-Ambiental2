<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGA HIDROITUANGO — Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --sga-900:#0a2e1a; --sga-800:#0f3d22; --sga-700:#155229;
      --sga-600:#1a6634; --sga-500:#1f7a3e; --sga-400:#28a84f;
      --sga-300:#52c46e; --sga-100:#c6f0d0; --sga-50:#edfaf1;
    }
    body { background: var(--sga-900); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Segoe UI',sans-serif; }
    .sga-card { background:#fff; border-radius:1.25rem; box-shadow:0 20px 60px rgba(0,0,0,.4); width:100%; max-width:420px; overflow:hidden; }
    .sga-header { background:linear-gradient(135deg,var(--sga-800),var(--sga-600)); padding:2rem; text-align:center; }
    .sga-header h1 { color:#fff; font-size:1.4rem; font-weight:700; margin:0; }
    .sga-header p  { color:var(--sga-100); font-size:.85rem; margin:.25rem 0 0; }
    .sga-body { padding:2rem; }
    .tab-btn { border:none; background:none; padding:.5rem 1rem; font-weight:600; color:#666; border-bottom:2px solid transparent; cursor:pointer; transition:all .2s; }
    .tab-btn.active { color:var(--sga-600); border-bottom-color:var(--sga-500); }
    .tab-pane { display:none; } .tab-pane.active { display:block; }
    .btn-sga { background:var(--sga-500); color:#fff; border:none; width:100%; padding:.7rem; border-radius:.6rem; font-weight:600; font-size:1rem; transition:background .2s; }
    .btn-sga:hover { background:var(--sga-400); color:#fff; }
    .role-badge { display:inline-block; padding:.2em .6em; border-radius:.4rem; font-size:.75rem; font-weight:600; }
    .role-admin { background:#fee2e2; color:#dc2626; }
    .role-op    { background:var(--sga-50); color:var(--sga-700); }
    .role-aud   { background:#e0f2fe; color:#0369a1; }
    #msg-login,#msg-reg { font-size:.85rem; margin-top:.5rem; display:none; }
    .device-status { display:flex; align-items:center; gap:.4rem; font-size:.78rem; color:var(--sga-600); margin-top:1rem; }
    .dot { width:8px; height:8px; border-radius:50%; background:#16a34a; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .demo-users { margin-top:1rem; font-size:.75rem; color:#666; border-top:1px solid #eee; padding-top:.75rem; }
  </style>
</head>
<body>
<div class="sga-card">
  <div class="sga-header">
    <div style="font-size:2.5rem">🌿</div>
    <h1>SGA HIDROITUANGO</h1>
    <p>Sistema de Gestión Ambiental v2.4.1</p>
    <div class="device-status justify-content-center mt-2">
      <span class="dot"></span>
      <span id="devices-count">Cargando dispositivos...</span>
    </div>
  </div>
  <div class="sga-body">
    <div class="d-flex mb-3 border-bottom">
      <button class="tab-btn active" onclick="showTab('login',this)">Iniciar Sesión</button>
      <button class="tab-btn" onclick="showTab('registro',this)">Crear Cuenta</button>
    </div>

    <!-- LOGIN -->
    <div id="tab-login" class="tab-pane active">
      <div class="mb-3">
        <label class="form-label fw-semibold">Correo electrónico</label>
        <input type="email" id="login-email" class="form-control" placeholder="usuario@sga.co">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Contraseña</label>
        <div class="input-group">
          <input type="password" id="login-pwd" class="form-control" placeholder="••••••••">
          <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('login-pwd')"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div id="msg-login" class="alert"></div>
      <button class="btn-sga" onclick="doLogin()"><i class="bi bi-box-arrow-in-right me-2"></i>Ingresar</button>
      <div class="demo-users">
        <strong>Cuentas de demo:</strong><br>
        admin@sga.co / admin123 <span class="role-badge role-admin">Admin</span><br>
        silvia@sga.co / op2026  <span class="role-badge role-op">Operativo</span><br>
        auditor@sga.co / aud456 <span class="role-badge role-aud">Auditor</span>
      </div>
    </div>

    <!-- REGISTRO -->
    <div id="tab-registro" class="tab-pane">
      <div class="mb-2">
        <label class="form-label fw-semibold">Nombre completo</label>
        <input type="text" id="reg-nombre" class="form-control" placeholder="Tu nombre">
      </div>
      <div class="mb-2">
        <label class="form-label fw-semibold">Correo</label>
        <input type="email" id="reg-email" class="form-control" placeholder="correo@sga.co">
      </div>
      <div class="mb-2">
        <label class="form-label fw-semibold">Contraseña</label>
        <input type="password" id="reg-pwd" class="form-control" placeholder="Mín. 6 caracteres">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Rol</label>
        <select id="reg-rol" class="form-select">
          <option value="Operativo">Operativo — Registra mediciones</option>
          <option value="Auditor">Auditor — Solo lectura y reportes</option>
          <option value="Administrador">Administrador — Acceso completo</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Planta asignada</label>
        <select id="reg-planta" class="form-select">
          <option value="Planta HIDROITUANGO">Planta HIDROITUANGO</option>
          <option value="Planta Hidrosogamoso">Planta Hidrosogamoso</option>
          <option value="Planta Guatapé">Planta Guatapé</option>
          <option value="Planta Termo-Norte">Planta Termo-Norte</option>
          <option value="Planta Enel">Planta Enel</option>
        </select>
      </div>
      <div id="msg-reg" class="alert"></div>
      <button class="btn-sga" onclick="doRegistro()"><i class="bi bi-person-plus me-2"></i>Crear cuenta</button>
    </div>
  </div>
</div>
<script src="sga-backend.js"></script>
<script>
(function () {
  if (!localStorage.getItem('sga_sesion')) location.replace('sga-login.html');
})();
</script>
<script>
  function showTab(id, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    btn.classList.add('active');
  }
  function togglePwd(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }
  function msg(id, texto, tipo) {
    const el = document.getElementById(id);
    el.textContent = texto; el.className = 'alert alert-' + tipo; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }
  function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pwd   = document.getElementById('login-pwd').value;
    const u     = Auth.login(email, pwd);
    if (!u) { msg('msg-login','Credenciales incorrectas. Verifica email y contraseña.','danger'); return; }
    location.href = 'sga-dsb2__final_.html';
  }
  function doRegistro() {
    const nombre = document.getElementById('reg-nombre').value.trim();
    const email  = document.getElementById('reg-email').value.trim();
    const pwd    = document.getElementById('reg-pwd').value;
    const rol    = document.getElementById('reg-rol').value;
    const planta = document.getElementById('reg-planta').value;
    if (!nombre || !email || !pwd) { msg('msg-reg','Completa todos los campos.','warning'); return; }
    if (pwd.length < 6)            { msg('msg-reg','La contraseña debe tener al menos 6 caracteres.','warning'); return; }
    const ok = Auth.registrar(nombre, email, pwd, rol, planta);
    if (!ok) { msg('msg-reg','Ese correo ya está registrado.','danger'); return; }
    msg('msg-reg','✅ Cuenta creada. Inicia sesión.','success');
    setTimeout(() => showTab('login', document.querySelector('.tab-btn')), 1500);
  }
  // Mostrar dispositivos conectados
  document.addEventListener('DOMContentLoaded', () => {
    const n = Dispositivos.conectados().length;
    document.getElementById('devices-count').textContent = n + ' dispositivo' + (n !== 1 ? 's' : '') + ' conectado' + (n !== 1 ? 's' : '');
  });
</script>
</body>
</html>
